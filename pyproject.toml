[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf-toolkit"
version = "0.1.0.dev0"
description = "One safe, permissively-licensed command-line tool for the common PDF chores."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES"]
authors = [{ name = "Armando Herra" }]
keywords = ["pdf", "cli", "merge", "split", "ocr", "rasterize"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]

# The complete approved runtime stack, declared up front so that no later spec
# has to add a runtime dependency: `THIRD_PARTY_LICENSES` and the website's
# license data are generated from the lockfile and diffed in CI, so an
# incremental addition turns an unrelated commit's gate red.
dependencies = [
  "pypdf[crypto]>=6.16.2,<7",
  "pypdfium2>=5.13.0,<6",
  "reportlab>=5.0.1,<6",
  "pikepdf>=10.12.0,<11",
  "pdfplumber>=0.11.10,<0.12",
  "pytesseract>=0.3.13,<0.4",
  "pillow>=12.3.0,<13",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# HTML/Markdown composition. Needs system pango/cairo, so it is never a base
# dependency; the base install must stay system-library-free.
html = ["weasyprint>=69.0,<70"]
all = ["weasyprint>=69.0,<70"]

[project.scripts]
pdftoolkit = "pdf_toolkit.cli.main:main"
pdf-toolkit = "pdf_toolkit.cli.main:main"

[project.urls]
Homepage = "https://github.com/ArmandoHerra/pdf-toolkit"
Repository = "https://github.com/ArmandoHerra/pdf-toolkit"
Changelog = "https://github.com/ArmandoHerra/pdf-toolkit/blob/main/changelog.md"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "hypothesis>=6.100",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "pip-licenses>=5.0",
  # PDF-28: already resolved transitively via bandit (uv.lock, pinned 6.0.3);
  # declared explicitly rather than relied upon so scripts/gate_parity.py's
  # ci.yml parse does not depend on bandit's dependency tree. Dev-only -- see
  # Design Sec 9 / AC21: cannot move THIRD_PARTY_LICENSES or licenses.json,
  # both generated from the --no-dev closure.
  "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/Makefile",
  "/THIRD_PARTY_LICENSES",
  "/README.md",
  "/CONTRIBUTING.md",
  "/TESTING.md",
  "/changelog.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
  "e2e: subprocess-level CLI runs against the installed console script",
  "samples: real-document arm over $PDF_TOOLKIT_SAMPLES_DIR (PLAN.md §10.1) -- skips visibly when unset",
  "requires(engine): skip visibly when the named engine/port does not resolve via ports.resolve()",
]

[tool.coverage.run]
source = ["pdf_toolkit"]
# B-034 (QA fingerprint 406420c494): `branch = true` forces coverage.py's
# classic ctrace backend on every Python version this project supports,
# because sys.monitoring's branch measurement isn't available here --
# `Can't use core=sysmon: sys.monitoring can't measure branches in this
# version, using default core`. ctrace tracing a pure-Python PDF-parsing
# adapter (`adapters/pypdf_structure.py`, the primary StructureEngine) is
# where the cost concentrates: one isolated `info` subprocess call measured
# 15.8s under this config vs 0.24s uninstrumented (~65x), and the
# `info`/`doctor`/`cli_contract` band (84 tests, identical band both arms)
# measured 544.59s instrumented vs 14.49s uninstrumented (~37.6x). Dropping
# `branch = true` alone does NOT fix it (line-only under ctrace was still
# 15.8s for that same single call) -- the fix is specifically `core =
# "sysmon"` becoming reachable once branch tracking is off: the same single
# call measured 0.34s (~46x faster than branch=true, ~1.4x over
# uninstrumented) and the same 84-test band measured 21.51s end-to-end
# (~25x faster). CI is unaffected by the slow path today (~86s for the full
# suite on Python 3.13 in the `engines-present` job, run 33287428715) but
# picks up the same sysmon speedup, and this config applies identically to
# both, so CI keeps measuring the same suite at the same or a lower
# resource cost -- nothing diverges between local and CI.
#
# WHAT THE FLOOR NOW MEANS: this is line coverage, not branch coverage.
# Line coverage is a weaker check -- a line inside an `if`/`else` counts as
# covered the moment either arm executes once, even if the other arm never
# does. It also reads higher for the same code (this band alone moved from
# 66.24% branch to 71.49% line). `--cov-fail-under=85` is unchanged and
# still enforced; it is enforcing a weaker property than it was before this
# change. Re-enabling branch coverage is a legitimate follow-up once
# coverage.py/CPython ship the version combination that supports branch
# measurement under sys.monitoring, at which point this comment block and
# the `core = "sysmon"` line below should be revisited together.
branch = false
core = "sysmon"
# The suite drives the CLI through subprocess.run (the only way exit codes and
# non-TTY posture are real -- see tests/registry.py, tests/test_doctor.py,
# tests/test_info.py). Without this, coverage.py measures the parent pytest
# process only, and every CLI-reached line executes in an unmeasured child.
# `patch = ["subprocess"]` rides the coverage.py-installed `a1_coverage.pth`
# hook (already present regardless of this setting) by exporting
# COVERAGE_PROCESS_CONFIG into os.environ, which every subprocess call site in
# this suite inherits by default. B-033/PDF-17: exactly ONE test scrubs those
# two variables from a child environment, and it is
# tests/test_cli_spine.py::test_help_stays_within_the_startup_budget -- the
# PLAN §12 R-13 startup-budget assertion, which must measure the product's own
# startup path rather than coverage.py's tracer overhead, and argues the point
# in place. This sentence previously named a different module, which scrubs
# nothing; a comment pointing at the wrong file is worse than no comment,
# because it sends the next reader somewhere nothing is wrong.
# `tests/test_coverage_policy.py` now pins the count at one AND pins this
# comment, so neither can drift again.
# `parallel = true` is not decoration: without it a spawned child's data_suffix
# defaults to None and every child overwrites the same data file instead of
# getting its own `.coverage.<host>.<pid>.<rand>` -- pytest-cov's own combine()
# step (run unconditionally at session end, `Central.finish()`) merges them
# back into one report regardless of whether xdist is in play.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build"]
