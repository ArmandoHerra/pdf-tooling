version: 2

# Cooldown (PDF-118): a release becomes eligible for a version-update PR only
# after 7 days. Updates run weekly on Monday, so the latency is 7 to 13 days.
# Dependabot security updates are disabled on this repo, so an advisory is
# caught by `vulncheck` (every PR and weekly), and a manual bump is not delayed.
updates:
  # Python dependencies. `uv` (NOT `pip`) is the correct ecosystem for this
  # project: it reads pyproject.toml AND uv.lock together. The `pip` ecosystem
  # would bump pyproject.toml and leave uv.lock stale, and every job that
  # installs the Python environment runs `uv sync --locked`, so every one of
  # them would then go red on a lockfile
  # that no longer matches — a self-inflicted permanent red on Dependabot PRs.
  #
  # Minor+patch are grouped into one PR to keep volume low, because every PR
  # runs the full required-check set; majors stay ungrouped so each one gets its own review.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Workflow actions across every workflow under .github/workflows/, all SHA-pinned. Dependabot
  # updates the 40-hex SHA and its trailing `# vX.Y.Z` comment together, which
  # is the second reason those comments are part of the pinning convention.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-all:
        patterns: ["*"]

  # CORRECTED (PDF-60, 2026-09-15): both clauses this comment used to make
  # were measured false. `gh api repos/ArmandoHerra/pdf-tooling/pulls/{n}/
  # commits --jq '.[] | .commit.message | test("Signed-off-by:")'`, re-run at
  # implementation HEAD against every open Dependabot pull request that day
  # (#2, #5, #6, #7 -- the PR numbers move as they close and reopen; a fixed
  # roster was never the point), showed EVERY one carrying the trailer. The
  # spec that drove this correction measured the same true fact three days
  # earlier against a different, now-closed roster (#2, #3, #4) -- so
  # Dependabot DOES sign off; the first clause was wrong regardless of which
  # PRs happen to be open when you check.
  # And branch protection now requires `dco` and enforces it on admins (read
  # 2026-10-07, .../branches/main/protection), so HC-3 was never a real
  # second reason either. Neither premise kept a DCO check out of scope --
  # `.github/workflows/dco.yml` now exists. One real consequence survives and
  # is why the engine exempts bots by identity rather than by email: the
  # trailer's email (`support@github.com`) does NOT match the commit author's
  # GitHub-asserted no-reply address, so a check written to compare emails
  # literally would block every dependency update forever. `scripts/
  # dco_check.py` reads `.author.type == "Bot"` -- GitHub's own resolution of
  # the account -- never the commit's self-reported bytes, which is the
  # difference between an exemption and a bypass on a public repository that
  # accepts fork pull requests.

  # --- PDF-16 appends the npm ecosystem block for /website here (PLAN §11.1.4). ---
  # PDF-16 APPENDS. It must fail loudly if this file is absent, never create it
  # (decision.md §0.3).
  # Website toolchain (PDF-16). Astro/Tailwind minor+patch grouped into one PR
  # to keep volume low; majors stay ungrouped so an Astro/Tailwind major gets
  # its own review (they have broken builds before).
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
