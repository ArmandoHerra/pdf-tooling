---
# PDF-02. The two machine-checked halves of claim G2 (PLAN §2) live here:
# `license-gate` (no AGPL/GPL/LGPL in the distributed closure) and the
# forbidden-name AST walk inside `test` (nothing reachable via subprocess
# either). A red in either is a product-claim failure, not a chore.
#
# Every third-party action is SHA-pinned to a 40-hex commit with a trailing
# `# vX.Y.Z` comment — the shape of mediakit's deploy-website.yml. Dependabot
# updates the SHA and the comment together, which is why the comment is part of
# the convention rather than decoration.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this whole workflow as its gate, which makes PLAN §11's
  # "the release job is gated behind the full ci.yml job set" literally true
  # rather than approximately so.
  workflow_call:
  # PDF-34 D8 Tier 1 / AC17: a cadence that fires with time, not only with a
  # commit -- an action deprecation, a `git` behaviour change, a base-image
  # bump. Weekly, Sunday 06:00 UTC. This is workflow-level (GitHub has no
  # per-job schedule), so a scheduled run exercises the full job set, not
  # only `docs-gate`; that is a wider net than the criterion requires, not a
  # narrower one.
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Redundant PR runs are cancelled. A `main` push run is NEVER cancelled: that
  # run is the wave gate for the cycle and something is waiting on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every uv invocation asserts the lockfile is current — including the ones
  # `make` reaches indirectly via `uv run`, which would otherwise be free to
  # re-resolve and quietly defeat the `uv sync --locked` discipline.
  # NOTE: UV_LOCKED, not UV_FROZEN. UV_FROZEN is mutually exclusive with the
  # `--locked` flag these steps pass ("the argument `--locked` cannot be used
  # with UV_FROZEN"), so setting it here would fail every sync step.
  # scripts/licenses.py strips both from its own subprocess env and states its
  # lockfile discipline explicitly (see its _clean_env docstring).
  UV_LOCKED: "1"
  # Pinned so a gitleaks release cannot change what this gate means overnight.
  GITLEAKS_VERSION: "8.30.1"

# PDF-29 -- `timeout-minutes` on EVERY job, derived rather than picked.
#
# WHY IT MATTERS MOST ON `main`. `concurrency.cancel-in-progress` above is
# FALSE for `main` pushes by design: that run is the wave gate and something is
# waiting on it. A `main`-push run therefore has no other bound at all --
# nothing cancels it, and without `timeout-minutes` GitHub's 360-MINUTE default
# is the only ceiling. One leg of run 99353776694 hung for 20+ minutes against
# 4-6 minute siblings; a job with no bound produces NO NUMBER when it hangs, it
# just stalls. An unbounded measurement is not a measurement.
#
# THE DERIVATION, applied identically to all ten jobs. For each job take the
# p95 wall-clock over the last 15 GREEN `ci.yml` runs (33609241110 ..
# 33724105752, 2026-09-02..2026-09-03) and set the bound to >= 3x that p95,
# rounded up, CAPPED at 30. Collected with:
#
#   gh run list --workflow=ci.yml --status success --limit 15 \
#       --json databaseId --jq '.[].databaseId'
#   gh api repos/ArmandoHerra/pdf-tooling/actions/runs/<id>/jobs?per_page=100 \
#       --jq '.jobs[] | [.name, .conclusion, .started_at, .completed_at] | @tsv'
#
# TWO PLACES THE RULE IS OVERRIDDEN, both deliberate and both stated in the
# job's own comment rather than left for a reader to infer:
#
#   * A 5-MINUTE FLOOR for the seven short jobs. Their p95 is 10-20 s and is
#     dominated by runner provisioning, not by work, so a literal 3x (45-60 s)
#     would go red on setup jitter rather than on a hang -- a control that goes
#     red without a defect costs more than one that stays green. 5 min is
#     >= 15x every observed p95 in that class and still 72x tighter than the
#     360-minute default this replaces.
#   * THE 30 CAP BINDS on `engines-present` (3x p95 = 35.7 min). The cap wins;
#     the bound is 2.5x p95 there, which is stated rather than smoothed over.
#
# The `test` job is a 4 x 2 matrix; `timeout-minutes` on the job applies to
# EACH leg, and the p95 above is over all 120 legs in the window.
#
# These bounds are NOT a guess dressed as a number, and the way you can tell is
# that the bound has been OBSERVED FIRING: PDF-29 pushed a throwaway branch
# with one job at `timeout-minutes: 1` running `sleep 120`, recorded the run id
# and GitHub's own annotation in its Implementation Log, and deleted the
# branch. A timeout that has never fired is one more control that cannot fail.
#
# If you change a value here, change its derivation comment in the same commit
# -- a derivation that outlives what it derived is worse than none.
jobs:
  lint:
    name: lint
    # PDF-29 bound: p95 14.0s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 0.7 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      # A red here is formatting or a lint rule, and the remedy differs:
      # `make fmt` rewrites the tree; a lint finding must be fixed or explicitly
      # justified with a scoped noqa. This target never degrades to a weaker
      # substitute and never exits 0 when the tool is absent (the MHC-51 lesson).
      - run: make fmt-check
      - run: make lint

  typecheck:
    name: typecheck
    # PDF-29 bound: p95 16.3s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 0.8 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: make typecheck

  test:
    name: test
    # PDF-29 bound: p95 524.0s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 26.2 min, rounded up; 120 matrix legs in the window. Derivation rule above `jobs:`.
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        # PLAN §9.1 C-02's matrix. macos-13 is deliberately ABSENT: GitHub's
        # macos-13 pool is being wound down and its jobs sit in "queued"
        # indefinitely, holding the whole run open so it never reaches a
        # terminal state. Do not add it back without checking pool health.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      # PDF-34 D5 (X-473 measured: delta ~=0-1s on both ubuntu-latest and
      # macos-14 -- seconds against PDF-29's 331.25s `make ci` budget, and a
      # DIFFERENT budget besides: this is CI wall clock, not the local gate).
      # fetch-depth: 0 closes 833321e40b literally here: the ten history-depth
      # arms and both `036fd0a353` changelog-debt arms now RUN on the job that
      # matters most instead of skipping silently against a shallow checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Engines are deliberately NOT installed here; the two engine
      # configurations are the engines-present / without-engines jobs below.
      - run: uv sync --locked
      # This is where tests/test_license_policy.py runs — the forbidden-name AST
      # walk. A red naming `gs`/`fitz`/`pdftotext` is a PLAN §7.2 violation
      # (a shell-out or import of a GPL/AGPL tool), NOT a flaky test. The remedy
      # is to remove the call, never to relax the walk.
      - run: make test

  engines-present:
    name: engines-present
    # PDF-29 bound: p95 713.0s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 35.7 min, CAPPED at 30 -- the cap binds, not the 3x rule. Derivation rule above `jobs:`.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install engines
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libreoffice-writer
      # PDF-15's engineer extends the apt list above if convert fixtures need
      # libreoffice-calc / -impress.
      - name: Verify engines present
        run: |
          tesseract --version
          soffice --version
      - run: uv sync --locked
      # PDF-06 fix-forward: the 85% floor is enforced HERE, and only here —
      # this is the one job where every verb's engine-backed path is actually
      # reachable, so Design §6's "adapters/ get a lower bar where an engine
      # is absent" is expressed by running the gate in exactly this
      # configuration rather than by omitting any file. `COVERAGE_FILE` is
      # pinned absolute for the same reason `make cover` pins it locally:
      # several tests spawn the CLI with `cwd` inside a temp directory, and an
      # unpinned relative data file would let a subprocess-measured `.coverage.*`
      # land somewhere a purity snapshot could see it.
      # PDF-28: was a direct `uv run pytest ...` invocation; now the SAME
      # command `make cover` runs, so the coverage floor is defined once
      # (Makefile:78) instead of twice (here and there) -- see
      # .github/gate-parity.toml's engines-present/cover entry.
      - name: Run suite with engines installed
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: make cover PYTEST_ARGS="--junitxml=junit-engines-present.xml"
      # With engines installed, an engine-gated SKIP means a test that should
      # have exercised a real engine silently did not — a false green.
      - name: Assert no engine-gated skips
        run: uv run python scripts/assert_skips.py junit-engines-present.xml --expect-zero

  without-engines:
    name: without-engines
    # PDF-29 bound: p95 495.3s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 24.8 min, rounded up. Derivation rule above `jobs:`.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      # This job's ENTIRE POINT is engine absence. If a runner image ever starts
      # shipping tesseract or libreoffice, that is a real finding to report, not
      # something to relax — the engines-absent configuration would have stopped
      # being tested at all.
      - name: Verify engines are absent
        run: |
          if command -v tesseract >/dev/null 2>&1 || command -v soffice >/dev/null 2>&1; then
            echo "engines unexpectedly present — this job's whole point is ABSENCE" >&2
            exit 1
          fi
      - run: uv sync --locked
      # PDF-28: was a direct `uv run pytest ...` invocation; now the SAME
      # command `make test` runs -- see .github/gate-parity.toml's
      # without-engines entries.
      - name: Run suite without engines
        run: make test PYTEST_ARGS="--junitxml=junit-without-engines.xml"
      # Prints "engine-gated skips: N". Vacuous by construction until PDF-06
      # introduces the markers, and it SAYS SO rather than implying coverage.
      - name: Assert engine-gated SKIP visibility
        run: uv run python scripts/assert_skips.py junit-without-engines.xml

  sast:
    name: sast
    # PDF-29 bound: p95 17.3s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 0.9 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      # THIS step is the gate. The report step below is artifact-only.
      - run: make sast
      - name: Bandit JSON report (artifact only)
        if: always()
        run: uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  vulncheck:
    name: vulncheck
    # PDF-29 bound: p95 19.7s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 1.0 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      # A red here is a CVE in a pinned dependency. Remedy: bump the dependency
      # and re-lock. Q5 freezes the dependency SET, not its versions.
      - run: make vulncheck

  secret-scan:
    name: secret-scan
    # PDF-29 bound: p95 10.0s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 0.5 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing here, not cosmetic: the default shallow
      # checkout gives gitleaks a single commit to scan, silently downgrading
      # the full-history gate to a one-commit gate that still reports success.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # The SAME command the developer runs locally (PLAN §8.1 "same as CI").
      # `make secret-scan` hard-fails with an install hint when gitleaks is
      # missing; it never exits 0 without having scanned.
      - run: make secret-scan
      - name: Gitleaks JSON report (artifact only)
        if: always()
        run: gitleaks detect --no-banner --report-path gitleaks-report.json --exit-code 0 || true
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  docs-gate:
    name: docs-gate
    # "green runs" below counts the docs-gate JOB's own conclusion, on throwaway
    # measurement branch pdf34-p95-measure; the surrounding RUN is red there by
    # construction, on the pre-derivation `test` job (X-473). This is the same
    # throwaway-branch shape this file's header records PDF-29 using.
    # PDF-34 bound: p95 20.0s over 5 green runs (33913473653..33913621276, 2026-09-04);
    # 3x p95 = 1.0 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    # PDF-34 D4/D8 Tier 1. The first job in the repository's history to run
    # arms 1 and 2 anywhere but a maintainer's laptop.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing here, for the identical reason it is on
      # secret-scan above: a shallow checkout makes require_full_history()
      # skip arm 3's ten history-depth checks (833321e40b) and both of the
      # changelog-debt arms this target exists to run (036fd0a353) -- this is
      # the first job in the repository's history to run those arms anywhere
      # but a maintainer's own full clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      # Non-strict (DOCS_GATE_STRICT unset): the five planning arms legitimately
      # skip here, because this checkout is `apps/pdf-tooling` alone and the
      # maintainer's planning tree lives in a separate repository (D8 Tier 1 /
      # Tier 2 split). The Tier-2 cadence that CAN see both trees runs it strict.
      - run: make docs-gate

  license-gate:
    name: license-gate
    # PDF-29 bound: p95 17.2s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 0.9 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    # 3.11 per PLAN §7.2 mechanism 1. scripts/licenses.py ALSO pins 3.11 for the
    # environment it measures, so this leg and a developer laptop on 3.14
    # produce a byte-identical inventory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      # THE product claim. A red here means a package whose license matches
      # AGPL|GPL|LGPL (or is UNKNOWN) entered the DISTRIBUTED closure.
      # Remedy: remove the dependency. NOT: widen the deny pattern — MPL-2.0 is
      # permitted and recorded (pikepdf bundles libqpdf; PLAN §12 R-11), so a
      # gate reddening on pikepdf would be a defective gate.
      - name: Regenerate and gate the license inventory
        run: make licenses
      # If this diff is non-empty, the committed inventory is stale relative to
      # uv.lock. Remedy: run `make licenses` locally and commit the result.
      - name: Assert THIRD_PARTY_LICENSES is current
        run: git diff --exit-code -- THIRD_PARTY_LICENSES
      # The dev tree is scanned too, so nothing goes unobserved — but it does not
      # block: a GPL dev tool is not on the product's call graph (PLAN §7.3).
      - name: Dev-tree license scan (informational, non-blocking)
        continue-on-error: true
        run: uv run python scripts/licenses.py check --informational

      # --- PDF-16 inserts the website licenses.json drift diff here (PLAN §12 R-15). ---
      # Shape: run `make licenses`, then `git diff --exit-code -- website/src/data/licenses.json`.
      # The generator already writes that file when website/src/data/ exists (PDF-02, scripts/licenses.py).

      - name: Regenerate website licence data
        run: make licenses

      - name: Fail on website licence drift
        run: git diff --exit-code -- website/src/data/licenses.json

  build:
    name: build
    # PDF-29 bound: p95 15.6s over 15 green runs (33609241110..33724105752, 2026-09-02..2026-09-03);
    # 3x p95 = 0.8 min, raised to the 5 min floor. Derivation rule above `jobs:`.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv build
      # PLAN §11 requires LICENSE, NOTICE and THIRD_PARTY_LICENSES inside BOTH
      # artifacts. Asserted by READING the archives, never by trusting the
      # build backend's include configuration to have stayed correct.
      - name: Assert both artifacts carry the license files
        run: uv run --no-project python scripts/assert_artifacts.py
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
