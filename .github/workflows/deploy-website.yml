---
name: Deploy Website

"on":
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # PDF-34 D7 / AC15 (`B-164`). Until this job existed, a push to `main` under
  # `paths:` above published this site with NOTHING in front of it -- no
  # `needs:`, no `workflow_run`, no `uses: ./.github/workflows/ci.yml` anywhere
  # in the file. The release path had been gated since PLAN §11; the publish
  # path never was, and nobody had connected the two.
  #
  # `workflow_call`, NOT `workflow_run`, and the reasoning is recorded here so
  # nobody re-derives it under time pressure. A local `uses:` call gates THE
  # EXACT COMMIT being published, keeps the `paths:` filter above intact, and
  # is the idiom `release.yml` already uses. `workflow_run` supports no path
  # filter and needs an explicit `head_sha` checkout that, if omitted, ships a
  # DIFFERENT commit from the one that went green -- a gate that green-lights
  # one commit and publishes another, which is this spec's failure mode in its
  # purest form.
  #
  # It fails closed in every direction: a red gate, or a cancelled one, skips
  # `build` and `deploy`, so the outcome is always "the site is not published"
  # and never "the site is published unverified". `workflow_dispatch` is
  # preserved and now runs the gate too -- a manual publish is gated exactly
  # like an automatic one, which is the point.
  gate:
    name: gate (full CI)
    # Deliberately NOT SHA-pinned, same exemption and same reason as
    # release.yml's: a LOCAL reusable workflow is addressed by path and always
    # runs at the caller's commit, so it carries no third-party supply-chain
    # risk. Pinning it would freeze the publish gate to a stale copy of CI.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'  # Astro 7 requires Node >=22.12
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
