---
# PDF-60. `CONTRIBUTING.md:13` has claimed, since before this repository had
# a test suite this size, that "commits without the trailer are rejected."
# Nothing rejected them. This workflow is that instrument, and it is a
# SEPARATE FILE from `ci.yml`, deliberately (D2):
#
#   * `ci.yml` runs in five trigger contexts that carry no pull request (a
#     `main` push, the weekly schedule, `workflow_dispatch`, and being CALLED
#     by `release.yml` and `deploy-website.yml`). A DCO job folded in there
#     would have to no-op in four of five contexts, which is a check that
#     mostly reports success for having done nothing.
#   * A twelfth `ci.yml` job would move six frozen coordinates across
#     `tests/test_gate_parity.py` and `tests/test_gate_budget.py` that this
#     cycle's `PDF-59` is the sole claimant of (`decision.md` §4.1). This file
#     moves none of them — the engine (`scripts/dco_check.py`) is exercised
#     entirely offline by `tests/test_merge_gate.py`.
#
# `pull_request`, NEVER `pull_request_target` (PDF-118 D2). Nothing here needs
# a privileged context: the check reads PR metadata through a read-only API
# call, and the only code the job EXECUTES is `scripts/dco_check.py` taken from
# the PR's BASE SHA (code already merged to `main`). The PR's own tree is never
# checked out, so a change to the checker alone cannot grade itself. The PR's
# commits enter only as data, and the checker prints them inertly.
#
# RESIDUAL, stated so nobody has to discover it: under `pull_request` the
# workflow DEFINITION is the PR's own. A PR that edits this file, or adds a
# workflow with a job named `dco`, is graded by its own definition. Every
# required context on this repository is bound to the Actions app rather than
# to a workflow file, so that property is not specific to `dco`; it is visible
# in the PR diff, and closing it is an operator settings question.
#
# The trigger is narrowed to pull requests INTO `main`: the PR-commits API
# computes its range against the PR's own base, so a PR into another branch
# would check only that branch's delta.
#
# No `concurrency` group is declared. `ci.yml`'s `cancel-in-progress: true`
# on pull requests exists so a re-push does not pay for a stale run twice;
# here it would instead defeat PDF-60 D7's measurement, which depends on
# every push producing its OWN complete, readable `dco` run.
name: DCO

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: dco
    # PDF-29 bound (PDF-118): p95 7.0s over 52 green runs of the dco JOB (its own conclusion)
    # 3x p95 = 21s, raised to the 5-minute floor, capped at 30.
    # The population predates the base-SHA sparse checkout; a single-file
    # checkout costs no more than the merge-ref one, and the floor sits well
    # above 3x p95, so the value cannot move.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dco-base
          persist-credentials: false
          sparse-checkout: scripts/dco_check.py
          sparse-checkout-cone-mode: false
      - name: Prove the checker is the base commit's
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C dco-base rev-parse HEAD)"
          if [ "$actual" != "$BASE_SHA" ]; then
            echo "dco: checker checked out at ${actual}, expected base ${BASE_SHA}" >&2
            exit 1
          fi
          sum="$(sha256sum dco-base/scripts/dco_check.py | cut -d' ' -f1)"
          echo "dco: checker ${sum} from base ${BASE_SHA} (PR head ${HEAD_SHA})"
      - name: Fetch the pull request's commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --paginate > "${RUNNER_TEMP}/dco-commits.json"
      - name: Run the DCO check
        env:
          DECLARED_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          python3 dco-base/scripts/dco_check.py \
            --input "${RUNNER_TEMP}/dco-commits.json" \
            --declared-count "$DECLARED_COUNT"
